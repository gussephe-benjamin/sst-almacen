<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SST Almacén: MVP navegable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAE8; --surface:#FFFFFF; --surface-2:#F4F6F5; --ink:#1C2529; --muted:#5B676D; --line:#D2D8D5; --line-soft:#E3E7E5;
  --trab:#1E5CA8; --sst:#0D7650; --mant:#C99300; --admin:#5A4CB0;
  --alto:#C3322A; --medio:#D98A0B; --bajo:#2F855A;
  --ok-bg:#E3F2EA; --warn-bg:#FCF1DC; --bad-bg:#F9E2E0; --info-bg:#E2ECF8; --neutral-bg:#ECEFEE;
  --cal:#2B8A9E; --tape-a:#F2C200; --tape-b:#1C2529;
  --role:var(--sst); --role-ink:#fff;
  --shadow:0 1px 0 rgba(28,37,41,.04), 0 8px 24px -12px rgba(28,37,41,.18);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13191C; --surface:#1B2328; --surface-2:#212B30; --ink:#E6ECEA; --muted:#9AA8AE; --line:#33414A; --line-soft:#2A363D;
    --trab:#5B9BE6; --sst:#33B07E; --mant:#E7B42A; --admin:#9488E8;
    --alto:#EC6A60; --medio:#F0A93A; --bajo:#5CC08A;
    --ok-bg:#183327; --warn-bg:#3A2D12; --bad-bg:#3B1C1A; --info-bg:#182B42; --neutral-bg:#26313A;
    --cal:#4FB6CB; --tape-b:#0E1316; --shadow:0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13191C; --surface:#1B2328; --surface-2:#212B30; --ink:#E6ECEA; --muted:#9AA8AE; --line:#33414A; --line-soft:#2A363D;
  --trab:#5B9BE6; --sst:#33B07E; --mant:#E7B42A; --admin:#9488E8;
  --alto:#EC6A60; --medio:#F0A93A; --bajo:#5CC08A;
  --ok-bg:#183327; --warn-bg:#3A2D12; --bad-bg:#3B1C1A; --info-bg:#182B42; --neutral-bg:#26313A;
  --cal:#4FB6CB; --tape-b:#0E1316; --shadow:0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body[data-role="trabajador"]{--role:var(--trab)}
body[data-role="sst"]{--role:var(--sst)}
body[data-role="mantenimiento"]{--role:var(--mant);--role-ink:#1C2529}
body[data-role="administracion"]{--role:var(--admin)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;line-height:1.15}
p{margin:0}
:focus-visible{outline:2px solid var(--role);outline-offset:2px}
.svgi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cond{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif}

/* ---------- Demo bar ---------- */
.demobar{position:relative;height:52px;background:#1C2529;color:#EEF2F0;display:flex;align-items:center;gap:14px;padding:0 18px 4px;z-index:30}
.demobar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-45deg,var(--tape-a) 0 10px,var(--tape-b) 10px 20px)}
.demobar .tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em;background:var(--tape-a);color:#1C2529;padding:3px 9px;border-radius:4px}
.demobar .lbl{color:#A9B6B3;font-size:13.5px}
.rolesw{display:flex;gap:4px;background:#2A363C;padding:4px;border-radius:10px}
.rolesw button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:#CBD5D2;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px}
.rolesw button .dot{width:9px;height:9px;border-radius:50%}
.rolesw button:hover{background:#34424A;color:#fff}
.rolesw button[aria-pressed="true"]{background:#F4F6F5;color:#1C2529;font-weight:600}
.demobar .sp{flex:1}
.dbtn{display:flex;align-items:center;gap:7px;border:1px solid #3A4950;background:transparent;color:#E3EAE7;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13.5px}
.dbtn:hover{background:#2A363C}
.dbtn .cnt{background:var(--tape-a);color:#1C2529;font-weight:700;font-size:12px;border-radius:10px;padding:0 6px}

/* ---------- Layout ---------- */
.shell{height:100%;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:grid;grid-template-columns:252px 1fr}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--role);color:var(--role-ink);display:grid;place-items:center}
.brand .mark .svgi{width:20px;height:20px}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:-2px}
.who{margin:0 14px 10px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-soft)}
.who .r{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--role)}
.who .r::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--role)}
.who .n{font-weight:600;margin-top:4px}
.who .p{color:var(--muted);font-size:13px}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:14.5px;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--role) 13%,transparent);color:var(--ink);font-weight:600}
.nav button[aria-current="page"] .svgi{color:var(--role)}
.nav .badge{margin-left:auto;background:var(--role);color:var(--role-ink);font-size:11.5px;font-weight:700;border-radius:10px;padding:0 7px;line-height:19px}
.nav .grp{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.side .foot{padding:12px 14px;border-top:1px solid var(--line-soft)}
.main{overflow:auto;min-height:0;padding:28px 34px 60px}
.page{max-width:1180px;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.phead h1{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;letter-spacing:.005em}
.phead p{color:var(--muted);margin-top:4px;max-width:70ch}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;border:0;background:none;cursor:pointer;padding:0;margin-bottom:8px}
.crumb:hover{color:var(--ink)}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:18px}
.card h2{font-size:17px;font-weight:600}
.card .sub{color:var(--muted);font-size:13.5px}
.chead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.chead .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--role);border-color:var(--role);color:var(--role-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--alto);border-color:color-mix(in srgb,var(--alto) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--neutral-bg);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--bajo)}
.chip.warn{background:var(--warn-bg);color:var(--medio)}
.chip.bad{background:var(--bad-bg);color:var(--alto)}
.chip.info{background:var(--info-bg);color:var(--trab)}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.rchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid var(--line)}
.rchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.risk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.risk i{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:var(--c)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--role);font-weight:600}
.tabs .n{font-size:12px;background:var(--neutral-bg);border-radius:9px;padding:0 6px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .code{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;color:var(--muted)}
.tscroll{overflow-x:auto}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13.5px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:14.5px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--role) 55%,transparent);border-color:var(--role)}
.photo-drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;gap:14px;background:var(--surface-2)}
.photo-drop img{width:96px;height:72px;object-fit:cover;border-radius:6px}
.photo-drop .ph{width:96px;height:72px;border-radius:6px;background:var(--line-soft);display:grid;place-items:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .inp{width:auto;padding:7px 10px;font-size:14px}

/* KPIs & charts */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:700;line-height:1}
.kpi .v small{font-size:17px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .l{color:var(--muted);font-size:13px;margin-top:6px}
.kpi.alert{border-color:color-mix(in srgb,var(--alto) 50%,var(--line))}
.kpi.alert .v{color:var(--alto)}
.bars{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.bar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .t span{display:block;height:100%;background:var(--c,var(--sst));border-radius:3px}
.bar .num{text-align:right;font-weight:600}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:18px 18px 12px}
.stack span{display:block;height:100%}
.legend{display:flex;gap:16px;padding:0 18px 16px;flex-wrap:wrap;font-size:13.5px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding:18px 18px 0}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .c .b{width:100%;max-width:46px;background:var(--sst);border-radius:4px 4px 0 0;display:flex;flex-direction:column-reverse;overflow:hidden}
.cols .c .b span{display:block}
.cols .c .val{font-weight:700;font-size:13.5px}
.cols-x{display:flex;gap:14px;padding:6px 18px 16px;border-top:1px solid var(--line-soft);margin:0}
.cols-x span{flex:1;text-align:center;font-size:12.5px;color:var(--muted)}
.attn{display:flex;flex-direction:column}
.attn button{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line-soft);background:none;padding:12px 18px;text-align:left;cursor:pointer}
.attn button:last-child{border-bottom:0}
.attn button:hover{background:var(--surface-2)}
.attn .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--c-bg);color:var(--c)}
.attn .tx{flex:1;min-width:0}
.attn .tx b{display:block;font-weight:600;font-size:14px}
.attn .tx span{color:var(--muted);font-size:13px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px}
.kcol h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.kcol h3 .n{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 7px;font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;display:block}
.kcard:hover{border-color:var(--role)}
.kcard .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.kcard b{display:block;margin:5px 0 8px;font-size:14.5px;font-weight:600;line-height:1.3}
.kcard .flag{margin-top:9px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:6px}
.kcard .flag.bad{background:var(--bad-bg);color:var(--alto)}
.kcard .flag.warn{background:var(--warn-bg);color:var(--medio)}
.kcard .flag.ok{background:var(--ok-bg);color:var(--bajo)}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.prog .t{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog .t span{display:block;height:100%;background:var(--role)}

/* Task / detail */
.dl{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft);align-items:start}
.step:last-child{border-bottom:0}
.step .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;border:1.5px solid var(--line);color:var(--muted);font-family:"Barlow Condensed",sans-serif}
.step.done .num{background:var(--bajo);border-color:var(--bajo);color:#fff}
.step.redo .num{background:var(--bad-bg);border-color:var(--alto);color:var(--alto)}
.step .ttl{font-weight:600}
.ev{display:flex;gap:12px;margin-top:9px;background:var(--surface-2);border-radius:8px;padding:8px;align-items:flex-start}
.ev img{width:120px;height:84px;object-fit:cover;border-radius:6px;cursor:zoom-in}
.ev p{font-size:13.5px}
.ev small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:10px;margin-bottom:16px;border:1px solid}
.banner .svgi{margin-top:2px}
.banner b{display:block}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--alto) 35%,transparent);color:var(--ink)}
.banner.bad .svgi{color:var(--alto)}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--medio) 35%,transparent)}
.banner.warn .svgi{color:var(--medio)}
.banner.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--bajo) 35%,transparent)}
.banner.ok .svgi{color:var(--bajo)}
.banner.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--trab) 30%,transparent)}
.banner.info .svgi{color:var(--trab)}
.banner .acts{margin-left:auto;display:flex;gap:8px;align-self:center}
.hist{list-style:none;margin:0;padding:6px 18px 14px}
.hist li{position:relative;padding:9px 0 9px 20px;font-size:13.5px;border-left:1.5px solid var(--line);margin-left:4px}
.hist li::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:1.5px solid var(--muted)}
.hist li small{display:block;color:var(--muted);font-size:12.5px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos img{width:160px;height:112px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--line-soft)}

/* EPP stepper */
.track{display:flex;align-items:center;gap:0;margin-top:12px}
.track .s{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.track .s i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.track .s.on{color:var(--ink);font-weight:600}
.track .s.on i{background:var(--c,var(--role));border-color:var(--c,var(--role));color:#fff}
.track .s i .svgi{width:12px;height:12px;stroke-width:2.6}
.track .ln{flex:1;height:1.5px;background:var(--line);margin:0 10px;min-width:20px}
.track .ln.on{background:var(--role)}
.req{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;cursor:pointer}
.req:hover{background:var(--surface-2)}
.req:last-child{border-bottom:0}
.req img{width:76px;height:58px;object-fit:cover;border-radius:6px}

/* Library */
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.libc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.libc:hover{border-color:var(--role)}
.libc .th{aspect-ratio:16/9;display:grid;place-items:center;background:var(--c);color:#fff;position:relative}
.libc .th img{width:100%;height:100%;object-fit:cover}
.libc .bd{padding:13px 15px 15px}
.libc .bd b{display:block;font-size:15px;margin:5px 0 4px;line-height:1.3}
.libc .bd p{color:var(--muted);font-size:13.5px}
.sign{width:74px;height:74px;display:grid;place-items:center;color:#fff}
.sign .svgi{width:38px;height:38px;stroke-width:2}
.sign.circle{border-radius:50%;background:rgba(255,255,255,.18);border:4px solid #fff}
.sign.tri{clip-path:polygon(50% 4%,98% 94%,2% 94%);background:#F2C200;color:#1C2529;width:84px;height:76px;padding-top:16px}
.sign.sq{border-radius:10px;background:rgba(255,255,255,.18);border:4px solid #fff}

/* Login */
.login{flex:1;display:grid;grid-template-columns:1.05fr 1fr}
.login .left{background:#1C2529;color:#EEF2F0;padding:56px 56px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login .left::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,#F2C200 0 16px,#1C2529 16px 32px)}
.login .left h1{font-family:"Barlow Condensed",sans-serif;font-size:58px;line-height:.98;font-weight:700;margin-top:36px;max-width:12ch}
.login .left p{color:#B3C0BC;font-size:16.5px;margin-top:18px;max-width:46ch}
.tour{margin-top:auto;padding-top:28px;border-top:1px solid #34424A}
.tour h3{font-size:15px;font-weight:600;margin-bottom:12px;color:#F2C200}
.tour ol{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:9px}
.tour li{counter-increment:t;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;color:#D6DFDC}
.tour li::before{content:counter(t);width:22px;height:22px;border-radius:50%;border:1.5px solid #5C6D74;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:"Barlow Condensed",sans-serif}
.tour li b{color:#fff;font-weight:600}
.login .right{padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:620px;width:100%;margin:0 auto}
.login .right h2{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 24px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.pick:hover{border-color:var(--c)}
.pick[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.pick .ic{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.pick b{display:block;font-size:15px}
.pick span{display:block;color:var(--muted);font-size:13px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-bottom:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(15,20,23,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal.wide{width:min(820px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.modal .mh h3{font-size:18px;font-weight:600;flex:1}
.modal .mb{padding:18px 20px;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line-soft)}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:420px;background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:-20px 0 40px -24px rgba(0,0,0,.35)}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.drawer .dh h3{font-size:17px;flex:1}
.drawer .db{overflow:auto;padding:6px 0}
.act{padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.act .fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.act .fl .svgi{width:14px;height:14px;color:var(--muted)}
.act p{font-size:14px;margin-top:6px}
.act small{color:var(--muted);font-size:12.5px}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1C2529;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:tin .25s ease}
.toast .svgi{color:#7FD6A8}
.toast em{font-style:normal;color:#F2C200;font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:80;display:grid;place-items:center;padding:40px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.notif{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft);align-items:flex-start;cursor:pointer}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:color-mix(in srgb,var(--role) 6%,transparent)}
.notif .ic{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--c,var(--muted))}
.notif .tx{flex:1}
.notif .tx small{color:var(--muted);display:block;font-size:12.5px;margin-top:2px}
.notif .u{width:9px;height:9px;border-radius:50%;background:var(--role);margin-top:6px}
.hello{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
.cta{background:var(--trab);color:#fff;border-radius:14px;padding:24px;display:flex;gap:20px;align-items:center;border:0;text-align:left;cursor:pointer;width:100%}
.cta:hover{filter:brightness(1.06)}
.cta .sign{flex:none}
.cta h2{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700}
.cta p{opacity:.85;margin-top:4px}
.mini{display:flex;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-soft)}
.mini:last-child{border-bottom:0}
.stockbar{display:flex;align-items:center;gap:8px}
.stockbar .t{width:80px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.stockbar .t span{display:block;height:100%}
.qty{display:flex;align-items:center;gap:6px}
.qty .inp{width:80px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.lib{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.login{grid-template-columns:1fr}.g2,.g3,.g-main,.hello,.kanban{grid-template-columns:1fr}.main{padding:20px}}
.chip .svgi{width:13px;height:13px;stroke-width:2.2}
.kcard .flag .svgi,.btn .svgi{width:16px;height:16px}
.kcard .flag.info{background:var(--info-bg);color:var(--trab)}
.step .num .svgi{width:15px;height:15px;stroke-width:2.6}
.attn > button > .svgi{color:var(--muted)}
.rchip{background:var(--surface)}
#root{height:100%}

.resp{display:flex;flex-direction:column;padding:0 8px 6px}
.resp-r{display:grid;grid-template-columns:12px 1fr auto 44px 48px;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer}
.resp-r:hover{background:var(--surface-2)}
.resp-r i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.resp-r .nm{font-weight:600}
.resp-r b{font-size:22px;text-align:right}
.resp-r .pc{font-weight:600;color:var(--muted);text-align:right}

</style>
</head>

<script>
/* ===================== Utilidades ===================== */
const DAY = 864e5;
const now = () => Date.now();
const dAgo = (d) => now() - d * DAY;
const dIn = (d) => now() + d * DAY;
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = (t) => { const d = new Date(t); return d.getDate() + ' ' + MES[d.getMonth()]; };
const fmtDY = (t) => { const d = new Date(t); return d.getDate() + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtDT = (t) => { const d = new Date(t); return fmtD(t) + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const sod = (t) => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const daysLeft = (t) => Math.round((sod(t) - sod(now())) / DAY);
const isoDate = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const parseDate = (v) => new Date(v + 'T17:00:00').getTime();
const rel = (t) => {
  const m = Math.round((now() - t) / 6e4);
  if (m < 1) return 'ahora';
  if (m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const d = Math.round(h / 24);
  if (d < 30) return 'hace ' + d + (d === 1 ? ' día' : ' días');
  return fmtD(t);
};

function sem(t) {
  if (t.estado === 'cerrada') return {c:'ok', t:'Cerrada el ' + fmtD(t.cerrada)};
  const d = daysLeft(t.limite);
  if (d < 0) return {c:'bad', t:`Vencida hace ${-d} ${-d === 1 ? 'día' : 'días'}`};
  if (d === 0) return {c:'warn', t:'Vence hoy'};
  if (d === 1) return {c:'warn', t:'Vence mañana'};

  return {c:'ok', t:'Vence el ' + fmtD(t.limite)};

  return `<div class="track">${node(true,'Enviada')}<span class="ln ${on2 ? 'on' : ''}"></span>${node(on2, mid[0], mid[1], mid[2])}<span class="ln ${on3 ? 'on' : ''}"></span>${node(on3,'Entregada')}</div>`;

  <dt>EPP</dt><dd>${esc(it.nombre)}</dd><dt>Motivo</dt><dd>${esc(e.motivo)}</dd><dt>Descripción</dt><dd style="font-weight:400">${esc(e.desc)}</dd><dt>Enviada</dt><dd>${fmtDT(e.fecha)}</dd>

    if (e.estado === 'en_espera') foot = `<button class="btn danger" data-a="eppReject" data-id="${id}">Rechazar</button><button class="btn primary" data-a="eppApprove" data-id="${id}" ${noStock ? 'disabled title="Aún no hay stock"' : ''}>${ic('check')}Aprobar</button>`;

  }

function pDash() {
  const valid = S.hallazgos.filter(h => h.estado !== 'descartado');
  const open = valid.filter(h => ['registrado','en_atencion'].includes(h.estado));
  const altoOpen = open.filter(h => h.riesgo === 'Alto').length;
  const closed = valid.filter(h => h.estado === 'cerrado' && h.cerradoEn);
  const avg = closed.length ? closed.reduce((s, h) => s + (h.cerradoEn - h.fecha) / DAY, 0) / closed.length : 0;
  const eppNew = S.epp.filter(e => e.estado === 'enviada').length;
  const porVal = S.tareas.filter(t => t.estado === 'por_validar').length;
  const low = S.inventario.filter(i => i.stock <= i.min);

  const items = [];
  S.tareas.filter(t => t.estado === 'por_validar').forEach(t => items.push({icon:'check', c:'var(--bajo)', bg:'var(--ok-bg)', t:`Validar ${t.id}: ${t.titulo}`, s:`${P(t.puesto).persona.nombre} terminó la tarea`, a:'go', v:'tarea', id:t.id}));
  S.tareas.filter(t => t.estado === 'modificacion').forEach(t => items.push({icon:'clock', c:'var(--medio)', bg:'var(--warn-bg)', t:`Responder pedido de ${t.mod.tipo.toLowerCase()} en ${t.id}`, s:`${P(t.puesto).persona.nombre}: ${t.mod.motivo}`, a:'go', v:'tarea', id:t.id}));
  S.hallazgos.filter(h => h.estado === 'en_atencion').forEach(h => { const ts = S.tareas.filter(t => t.hallazgo === h.id); if (ts.length && ts.every(t => t.estado === 'cerrada')) items.push({icon:'shield', c:'var(--sst)', bg:'var(--ok-bg)', t:`Cerrar ${h.id}: sus tareas ya están validadas`, s:h.desc, a:'go', v:'hallazgo', id:h.id}); });
  S.epp.filter(e => e.estado === 'enviada').sort((a,b) => b.fecha - a.fecha).forEach(e => items.push({icon:'helmet', c:'var(--trab)', bg:'var(--info-bg)', t:`${e.persona.nombre} pide ${item(e.item).nombre}`, s:`${e.id}, ${rel(e.fecha)}`, a:'eppView', id:e.id}));
  S.epp.filter(e => e.estado === 'en_espera' && item(e.item).stock > 0).forEach(e => items.push({icon:'box', c:'var(--bajo)', bg:'var(--ok-bg)', t:`Ya hay stock para ${e.id}`, s:`${item(e.item).nombre} de ${e.persona.nombre}`, a:'eppView', id:e.id}));
  S.tareas.filter(t => !['cerrada','por_validar'].includes(t.estado) && daysLeft(t.limite) < 0).forEach(t => items.push({icon:'alert', c:'var(--alto)', bg:'var(--bad-bg)', t:`${t.id} está vencida`, s:t.titulo, a:'go', v:'tarea', id:t.id}));
  S.hallazgos.filter(h => h.estado === 'registrado').forEach(h => items.push({icon:'alert', c:RC[h.riesgo], bg:'var(--surface-2)', t:`Asignar una tarea a ${h.id}`, s:h.desc, a:'go', v:'hallazgo', id:h.id}));
  if (low.length) items.push({icon:'box', c:'var(--medio)', bg:'var(--warn-bg)', t:`${low.length} recursos en o bajo el mínimo`, s:low.slice(0, 3).map(i => i.nombre).join(', ') + (low.length > 3 ? '…' : ''), a:'go', v:'inventario'});

  const count = (arr, key, keys) => { const m = {}; (keys || []).forEach(k => m[k] = 0); arr.forEach(x => m[x[key]] = (m[x[key]] || 0) + 1); return Object.entries(m); };
  const byTipo = count(valid, 'tipo').sort((a,b) => b[1] - a[1]);

  const openByResp = AREAS_RESP.map(r => [r, open.filter(h => h.areaResp === r).length]);
  const months = [];

  const maxM = Math.max(1, ...mData.map(x => x.n));
  const avgRisk = RIESGOS.map(r => { const cs = closed.filter(h => h.riesgo === r); return [r, cs.length ? cs.reduce((s, h) => s + (h.cerradoEn - h.fecha) / DAY, 0) / cs.length : 0]; });
  const maxA = Math.max(1, ...avgRisk.map(x => x[1]));

  return `<div class="phead"><div><h1>Dashboard SST</h1><p>Estado de los hallazgos, las solicitudes de EPP y las tareas con otras áreas.</p></div><div class="acts"><button class="btn" data-a="go" data-v="hallazgos">${ic('alert')}Ver hallazgos</button><button class="btn primary" data-a="halNew">${ic('plus')}Registrar hallazgo</button></div></div>

    <div class="kpi ${low.length ? 'alert' : ''}"><div class="v cond">${low.length}</div><div class="l">Recursos bajo el mínimo</div></div>

  let b = '';
  if (t.estado === 'asignada') {
    if (t.modResp) b += banner('bad', 'x', isS ? 'Rechazaste el pedido de modificación' : 'SST rechazó tu pedido de modificación', `“${esc(t.modResp)}”`);
    b += isS ? banner('info', 'clock', `Esperando que ${esc(resp)} acepte la tarea`, `Asignada el ${fmtD(t.creada)}.`)
      : banner('info', 'clip', 'SST te asignó esta tarea', 'Acéptala para empezar o pide un cambio de plazo o alcance si no puedes cumplirla.', `<button class="btn" data-a="modAsk" data-id="${id}">Solicitar modificación</button><button class="btn primary" data-a="taskAccept" data-id="${id}">${ic('check')}Aceptar tarea</button>`);
  }
  if (t.estado === 'modificacion') {
    const m = t.mod;
    const txt = `${m.tipo === 'Plazo' ? `Nueva fecha propuesta: <b>${fmtDY(m.nuevaFecha)}</b> (actual: ${fmtD(t.limite)}). ` : ''}Motivo: “${esc(m.motivo)}”`;
    b = isS ? banner('warn', 'clock', `${esc(resp)} solicita una modificación de ${m.tipo.toLowerCase()}`, txt, `<button class="btn" data-a="modReject" data-id="${id}">Rechazar</button><button class="btn primary" data-a="modApprove" data-id="${id}">Aprobar cambio</button>`)
      : banner('warn', 'clock', 'Esperando respuesta de SST', `Pediste una modificación de ${m.tipo.toLowerCase()}. ${txt}`);
  }
  if (t.estado === 'por_validar') b = isS ? banner('ok', 'check', `${esc(resp)} terminó la tarea`, 'Revisa la evidencia de cada paso. Si está conforme, ciérrala; si no, devuélvela con una alerta.', `<button class="btn danger" data-a="taskReturn" data-id="${id}">${ic('flag')}Devolver con alerta</button><button class="btn primary" data-a="taskClose" data-id="${id}">${ic('check')}Cerrar tarea</button>`)
    : banner('info', 'send', 'Enviada a SST para validación', 'SST revisará la evidencia y cerrará la tarea o te la devolverá con observaciones.');
  if (t.estado === 'devuelta') b = banner('bad', 'flag', isS ? 'Devuelta: esperando corrección' : 'SST devolvió la tarea: no se hizo correctamente', `“${esc(t.devol.com)}”${isS ? '' : ' Rehaz los pasos marcados en rojo y vuelve a enviarla.'}`);
  if (t.estado === 'cerrada') b = banner('ok', 'check', `Cerrada por SST el ${fmtD(t.cerrada)}`, 'La evidencia fue validada.');
  if (t.estado === 'en_proceso' && isS) b = banner('info', 'clock', `${esc(resp)} está trabajando en la tarea`, 'Verás cada paso completado con su evidencia en cuanto lo suba.');
  if (!isS && ['en_proceso','devuelta'].includes(t.estado) && allDone) b += banner('ok', 'check', 'Todos los pasos tienen evidencia', t.estado === 'devuelta' ? 'Reenvía la tarea para que SST la valide otra vez.' : 'Marca la tarea como terminada para avisar a SST.', `<button class="btn primary" data-a="taskDone" data-id="${id}">${ic('send')}${t.estado === 'devuelta' ? 'Reenviar a SST' : 'Marcar como terminada'}</button>`);
  const canWork = !isS && ['en_proceso','devuelta'].includes(t.estado);
  const steps = t.pasos.map((s, i) => {
    const old = !s.done && s.ev;
    return `<li class="step ${s.done ? 'done' : ''} ${s.redo && !s.done ? 'redo' : ''}"><span class="num">${s.done ? ic('check') : i + 1}</span><div><div class="ttl">${esc(s.t)}</div>
    ${s.redo && !s.done ? `<div class="small" style="color:var(--alto);font-weight:600">SST pidió rehacer este paso</div>` : ''}
    ${s.ev ? `<div class="ev" ${old ? 'style="opacity:.55"' : ''}><img src="${s.ev.foto}" data-zoom alt="Evidencia del paso ${i + 1}"><div>${old ? '<small style="margin:0 0 4px">Evidencia anterior</small>' : ''}<p>${esc(s.ev.com)}</p><small>${esc(s.ev.quien)}, ${fmtDT(s.ev.fecha)}</small></div></div>` : `<div class="small muted">Sin evidencia todavía</div>`}</div>
    <div>${canWork && !s.done ? `<button class="btn sm primary" data-a="stepDo" data-id="${id}" data-v="${i}">${ic('camera')}Completar paso</button>` : ''}${canWork && s.done ? `<button class="btn sm ghost" data-a="stepUndo" data-id="${id}" data-v="${i}">${ic('undo')}Rehacer</button>` : ''}</div></li>`;
  }).join('');
  const asignador = t.hist.length ? t.hist[0].quien : 'SST';
  return `<button class="crumb" data-a="go" data-v="${isS ? 'tareas' : 'tablero'}">${ic('back')}${isS ? 'Tareas a áreas' : 'Mis tareas'}</button>
  <div class="phead"><div><div class="row wrap" style="margin-bottom:8px"><span class="cond" style="font-size:18px;font-weight:700;color:var(--muted)">${t.id}</span>${chip(TST, t.estado)}${semChip(t)}</div><h1>${esc(t.titulo)}</h1></div></div>
  ${b}
  <div class="grid g-main"><div class="grid" style="align-content:start">
    <div class="card"><div class="chead"><h2>Pasos</h2><span class="sp"></span><div style="width:140px">${prog(t)}</div></div><ol class="steps">${steps}</ol></div>
    <div class="card pad"><h2 style="margin-bottom:8px">Indicaciones de SST</h2><p style="max-width:70ch">${esc(t.desc)}</p></div>
  </div><div class="grid" style="align-content:start">
    <div class="card pad"><dl class="dl"><dt>Origen</dt><dd>${isS ? `<button class="btn sm" data-a="go" data-v="hallazgo" data-id="${h.id}">${h.id}: ${esc(h.desc)}</button>` : `Hallazgo ${h.id}`}</dd><dt>Área</dt><dd>${roleChip(t.area)}</dd><dt>Responsable</dt><dd>${esc(resp)}<div class="small muted">${esc(P(t.puesto).nombre)}</div></dd><dt>Asignada por</dt><dd>${esc(asignador)}</dd><dt>Asignada</dt><dd>${fmtDT(t.creada)}</dd><dt>Fecha límite</dt><dd>${fmtDY(t.limite)}</dd></dl>
    ${!isS ? `<h4 style="font-size:14px;margin:16px 0 8px">Foto del hallazgo</h4><div class="photos">${h.fotos.map(f => `<img src="${f}" data-zoom alt="Foto del hallazgo" style="width:100%;height:auto">`).join('')}</div><p class="small muted" style="margin-top:6px">${esc(h.desc)}. ${h.area}.</p>` : ''}</div>
    <div class="card"><div class="chead"><h2>Historial</h2></div>${histList(t.hist)}</div>
  </div></div>`;
}
function taskAccept(id) {
  const t = T(id); t.estado = 'en_proceso'; t.modResp = null; addHist(t, 'Aceptó la tarea');
  notify('sst', null, `${meName()} aceptó ${id}: ${t.titulo}.`, {t:'tarea', id}, 'check');
  act(cur.role, 'sst', `${meName()} aceptó la tarea ${id}.`);
  commit(); toast('Tarea aceptada. Ya puedes completar los pasos.');
}
function modAsk(id) {
  const t = T(id);
  modal('Solicitar modificación', `<p class="muted small" style="margin-bottom:14px">SST revisará tu pedido. Si lo aprueba, la tarea queda aceptada con el cambio.</p>
  <div class="grid g2"><div class="field"><label for="mo-tipo">Qué necesitas cambiar</label><select class="inp" id="mo-tipo"><option>Plazo</option><option>Alcance</option></select></div>
  <div class="field"><label for="mo-fecha">Nueva fecha límite</label><input class="inp" id="mo-fecha" type="date" value="${isoDate(t.limite + 5 * DAY)}"><span class="hint">Solo si pides más plazo. Actual: ${fmtDY(t.limite)}.</span></div></div>
  <div class="field"><label for="mo-mot">Motivo</label><textarea class="inp" id="mo-mot" placeholder="Explica por qué no es posible cumplir la tarea como está"></textarea></div><div id="m-err"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn primary" data-a="modSend" data-id="${id}">${ic('send')}Enviar a SST</button>`);
}
function modSend(id) {
  const t = T(id), tipo = val('#mo-tipo'), mot = val('#mo-mot'), f = val('#mo-fecha');
  if (!mot) return mErr('Escribe el motivo.');
  if (tipo === 'Plazo' && (!f || parseDate(f) <= t.limite)) return mErr('La nueva fecha debe ser posterior a la fecha límite actual.');
  t.mod = {tipo, nuevaFecha: tipo === 'Plazo' ? parseDate(f) : null, motivo:mot, fecha:now()};
  t.estado = 'modificacion'; t.modResp = null; addHist(t, `Solicitó modificación de ${tipo.toLowerCase()}`);
  notify('sst', null, `${meName()} solicitó modificación de ${tipo.toLowerCase()} en ${id}.`, {t:'tarea', id}, 'clock');
  act(cur.role, 'sst', `${meName()} pidió modificar el ${tipo.toLowerCase()} de ${id}${tipo === 'Plazo' ? ' hasta el ' + fmtD(t.mod.nuevaFecha) : ''}.`);
  closeModal(); commit(); toast('Pedido enviado a SST.');
}
function modApprove(id) {
  const t = T(id), m = t.mod;
  if (m.tipo === 'Plazo' && m.nuevaFecha) t.limite = m.nuevaFecha;
  t.estado = 'en_proceso'; t.mod = null; t.modResp = null;
  addHist(t, `Aprobó la modificación de ${m.tipo.toLowerCase()}${m.tipo === 'Plazo' ? '; nueva fecha límite ' + fmtD(t.limite) : ''}`);
  notify(t.area, t.puesto, `SST aprobó tu pedido en ${id}. La tarea quedó aceptada${m.tipo === 'Plazo' ? ' con fecha límite ' + fmtD(t.limite) : ''}.`, {t:'tarea', id}, 'check');
  act('sst', t.area, `${meName()} aprobó el cambio de ${m.tipo.toLowerCase()} en ${id}.`);
  commit(); toast('Modificación aprobada.');
}
function modReject(id) {
  modal('Rechazar modificación', `<div class="field"><label for="mr-com">Respuesta para el responsable</label><textarea class="inp" id="mr-com" placeholder="Ejemplo: el riesgo es alto, necesitamos mantener la fecha. Busca otro proveedor."></textarea></div><div id="m-err"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn danger" data-a="modRejectSave" data-id="${id}">Rechazar pedido</button>`);
}
function modRejectSave(id) {
  const c = val('#mr-com'); if (!c) return mErr('Escribe una respuesta.');
  const t = T(id); t.estado = 'asignada'; t.modResp = c; t.mod = null; addHist(t, 'Rechazó el pedido de modificación');
  notify(t.area, t.puesto, `SST rechazó tu pedido de modificación en ${id}.`, {t:'tarea', id}, 'x');
  act('sst', t.area, `${meName()} rechazó el pedido de modificación de ${id}.`);
  closeModal(); commit(); toast('Pedido rechazado. La tarea vuelve a esperar aceptación.');
}
function stepDo(id, i) {
  const t = T(id); UI.photos = {}; UI.stepScene = t.escena || 'trabajo';
  modal(`Paso ${+i + 1}: ${esc(t.pasos[i].t)}`, `<div class="field"><label>Foto de evidencia</label>${photoField('step')}</div><div class="field"><label for="st-com">Comentario</label><textarea class="inp" id="st-com" placeholder="Qué hiciste y en qué estado queda"></textarea></div><div id="m-err"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn primary" data-a="stepSave" data-id="${id}" data-v="${i}">${ic('check')}Guardar paso</button>`);
}
function stepSave(id, i) {
  const t = T(id), com = val('#st-com');
  if (!UI.photos.step) return mErr('Adjunta una foto de evidencia.');
  if (!com) return mErr('Escribe un comentario.');
  const s = t.pasos[i]; s.done = true; s.redo = false; s.ev = {foto:UI.photos.step, com, fecha:now(), quien:meName()};
  addHist(t, `Completó el paso ${+i + 1} con evidencia`);
  act(cur.role, 'sst', `${meName()} completó el paso ${+i + 1} de ${id} con evidencia.`);
  UI.photos = {}; closeModal(); commit();
  toast(t.pasos.every(x => x.done) ? 'Todos los pasos listos. Marca la tarea como terminada.' : `Paso ${+i + 1} completado.`);
}
function stepUndo(id, i) { const t = T(id), s = t.pasos[i]; s.done = false; addHist(t, `Reabrió el paso ${+i + 1}`); commit(); }
function taskDone(id) {
  const t = T(id), re = t.estado === 'devuelta';
  t.estado = 'por_validar'; addHist(t, re ? 'Reenvió la tarea corregida' : 'Marcó la tarea como terminada');
  notify('sst', null, `${meName()} ${re ? 'corrigió y reenvió' : 'terminó'} ${id}. Revisa la evidencia para cerrarla.`, {t:'tarea', id}, 'clip');
  act(cur.role, 'sst', `${meName()} ${re ? 'reenvió corregida' : 'marcó como terminada'} la tarea ${id} y la envió a validación.`);
  commit(); toast('Tarea enviada a SST para validación.');
}
function taskClose(id) {
  const t = T(id); t.estado = 'cerrada'; t.cerrada = now(); t.devol = null; addHist(t, 'Validó la evidencia y cerró la tarea');
  const h = H(t.hallazgo); addHist(h, `Se cerró la tarea ${id}`);
  notify(t.area, t.puesto, `SST validó y cerró ${id}. ¡Buen trabajo!`, {t:'tarea', id}, 'check');
  act('sst', t.area, `${meName()} validó la evidencia y cerró ${id}.`);
  commit();
  const ts = S.tareas.filter(x => x.hallazgo === h.id);
  toast(ts.every(x => x.estado === 'cerrada') ? `Tarea cerrada. Ya puedes cerrar el hallazgo <em>${h.id}</em>.` : 'Tarea cerrada.');
}
function taskReturn(id) {
  const t = T(id);
  modal('Devolver con alerta', `<p class="muted small" style="margin-bottom:14px">El responsable recibirá una alerta indicando que la tarea no se hizo correctamente.</p>
  <div class="field"><label for="rt-com">Qué no está bien</label><textarea class="inp" id="rt-com" placeholder="Ejemplo: la foto no muestra la señal instalada en el pasillo 4."></textarea></div>
  <div class="field"><label>Pasos que debe rehacer</label>${t.pasos.map((s, i) => `<label class="row small" style="font-weight:500;padding:4px 0"><input type="checkbox" data-redo="${i}">Paso ${i + 1}: ${esc(s.t)}</label>`).join('')}</div><div id="m-err"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn danger" data-a="taskReturnSave" data-id="${id}">${ic('flag')}Devolver tarea</button>`);
}
function taskReturnSave(id) {
  const c = val('#rt-com'); if (!c) return mErr('Explica qué no está bien.');
  const t = T(id);
  document.querySelectorAll('[data-redo]').forEach(cb => { if (cb.checked) { const s = t.pasos[+cb.dataset.redo]; s.done = false; s.redo = true; } });
  t.estado = 'devuelta'; t.devol = {com:c, fecha:now()}; addHist(t, 'Devolvió la tarea con alerta: no se hizo correctamente');
  notify(t.area, t.puesto, `SST devolvió ${id}: no se hizo correctamente.`, {t:'tarea', id}, 'flag');
  act('sst', t.area, `${meName()} devolvió ${id} con una alerta: “${c}”`);
  closeModal(); commit(); toast('Tarea devuelta con alerta.');
}

/* ===================== SST: Solicitudes de EPP ===================== */
function pEpp() {
  const tabs = [['enviada','Nuevas'],['aprobada','Aprobadas'],['en_espera','En espera'],['entregada','Entregadas'],['rechazada','Rechazadas'],['todas','Todas']];
  const list = S.epp.filter(e => UI.eTab === 'todas' || e.estado === UI.eTab).sort((a,b) => b.fecha - a.fecha);
  return `<div class="phead"><div><h1>Solicitudes de EPP</h1><p>Solicitudes de cambio o reposición enviadas por los trabajadores. Al marcar una entrega, el stock se descuenta del inventario.</p></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${UI.eTab === k}" data-a="eTab" data-v="${k}">${l}<span class="n">${k === 'todas' ? S.epp.length : S.epp.filter(e => e.estado === k).length}</span></button>`).join('')}</div>
  <div class="card">${list.map(e => { const it = item(e.item), st = stockState(it), pp = P(e.puesto); return `<div class="req" role="button" tabindex="0" data-a="eppView" data-id="${e.id}"><img src="${e.foto}" alt=""><div><div class="row wrap"><b>${esc(it.nombre)}</b><span class="small muted">${e.id}</span></div><div class="small">${esc(e.persona.nombre)}, ${esc(pp ? pp.nombre : '')}</div><div class="small muted">${esc(e.motivo)}. ${rel(e.fecha)}${e.estado === 'en_espera' ? `. Cambio estimado: ${fmtD(e.espera)}` : ''}</div></div><div class="row">${['enviada','en_espera','aprobada'].includes(e.estado) ? `<span class="chip ${st[1]}">Stock: ${it.stock}</span>` : ''}${chip(EST, e.estado)}</div></div>`; }).join('') || emptyBox('No hay solicitudes en esta pestaña')}</div>`;
}
function eppApprove(id) {
  const e = E(id), it = item(e.item);
  if (it.stock <= 0) return toast('No hay stock. Pon la solicitud en espera.');
  e.estado = 'aprobada'; addHist(e, 'Aprobó la solicitud');
  notify('trabajador', e.puesto, `Tu solicitud ${id} fue aprobada. Acércate a SST con tu EPP anterior para la entrega.`, {t:'epp', id}, 'check');
  act('sst', 'trabajador', `${meName()} aprobó la solicitud ${id} de ${e.persona.nombre}.`);
  commit(); eppView(id); toast(`Solicitud <em>${id}</em> aprobada.`);
}
function eppWait(id) {
  modal('Poner en espera', `<p class="muted small" style="margin-bottom:14px">El trabajador verá la fecha estimada en la que podrá recibir su EPP.</p><div class="field"><label for="w-f">Fecha estimada de cambio</label><input class="inp" id="w-f" type="date" value="${isoDate(dIn(7))}"></div><div id="m-err"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn primary" data-a="eppWaitSave" data-id="${id}">${ic('pause')}Poner en espera</button>`);
}
function eppWaitSave(id) {
  const f = val('#w-f'); if (!f) return mErr('Elige una fecha.');
  if (parseDate(f) < sod(now())) return mErr('La fecha no puede ser anterior a hoy.');
  const e = E(id); e.estado = 'en_espera'; e.espera = parseDate(f); addHist(e, `Puso la solicitud en espera hasta el ${fmtD(e.espera)} por falta de stock`);
  notify('trabajador', e.puesto, `Tu solicitud ${id} quedó en espera. Fecha estimada de cambio: ${fmtD(e.espera)}.`, {t:'epp', id}, 'pause');
  act('sst', 'trabajador', `${meName()} puso en espera la solicitud ${id} de ${e.persona.nombre} hasta el ${fmtD(e.espera)}.`);
  closeModal(); commit(); toast(`Solicitud <em>${id}</em> en espera.`);
}
function eppReject(id) {
  modal('Rechazar solicitud', `<div class="field"><label for="rj-m">Motivo</label><textarea class="inp" id="rj-m" placeholder="El trabajador verá este motivo"></textarea></div><div id="m-err"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn danger" data-a="eppRejectSave" data-id="${id}">Rechazar solicitud</button>`);
}
function eppRejectSave(id) {
  const m = val('#rj-m'); if (!m) return mErr('Escribe el motivo.');
  const e = E(id); e.estado = 'rechazada'; e.rechazo = m; addHist(e, 'Rechazó la solicitud');
  notify('trabajador', e.puesto, `Tu solicitud ${id} fue rechazada. Motivo: ${m}`, {t:'epp', id}, 'x');
  act('sst', 'trabajador', `${meName()} rechazó la solicitud ${id} de ${e.persona.nombre}.`);
  closeModal(); commit(); toast(`Solicitud <em>${id}</em> rechazada.`);
}
function eppDeliver(id) {
  const e = E(id), it = item(e.item);
  modal('Confirmar entrega', `<p style="margin-bottom:14px">Entregarás <b>${esc(it.nombre)}</b> a ${esc(e.persona.nombre)}. Se descontará 1 unidad del inventario (stock actual: ${it.stock}).</p>
  <label class="row" style="padding:6px 0"><input type="checkbox" id="dv-1">El trabajador devolvió el EPP anterior</label>
  <label class="row" style="padding:6px 0"><input type="checkbox" id="dv-2">Firmó el formato físico de entrega</label><div id="m-err" style="margin-top:10px"></div>`,
  `<button class="btn" data-a="close">Cancelar</button><button class="btn primary" data-a="eppDeliverSave" data-id="${id}">${ic('check')}Confirmar entrega</button>`);
}
function eppDeliverSave(id) {
  if (!$('#dv-1').checked || !$('#dv-2').checked) return mErr('Confirma la devolución del EPP anterior y la firma del formato.');
  const e = E(id), it = item(e.item);
  if (it.stock <= 0) return mErr('No hay stock para entregar.');
  it.stock -= 1; it.mov.push({f:now(), tipo:'Salida', cant:1, nota:`Entrega ${id} a ${e.persona.nombre}`, quien:meName()});
  e.estado = 'entregada'; e.entrega = {fecha:now(), devuelto:true}; addHist(e, 'Marcó como entregada; EPP anterior devuelto y formato firmado');
  notify('trabajador', e.puesto, `Recibiste tu ${it.nombre} (${id}). Solicitud cerrada.`, {t:'epp', id}, 'check');
  act('sst', 'trabajador', `${meName()} entregó ${it.nombre} a ${e.persona.nombre} (${id}); el stock bajó a ${it.stock}.`);
  if (it.stock <= it.min) notify('sst', null, `Stock bajo: ${it.nombre} (${it.stock} en stock, mínimo ${it.min}).`, {t:'inv', id:it.id}, 'box');
  closeModal(); commit();
  toast(it.stock <= it.min ? `Entrega registrada. <em>${esc(it.nombre)}</em> quedó en o bajo el mínimo.` : 'Entrega registrada y stock actualizado.');
}

/* ===================== SST: Inventario ===================== */
function pInv() {
  const tabs = ['Todos', ...CATS];
  const list = S.inventario.filter(i => UI.invTab === 'Todos' || i.cat === UI.invTab);
  const low = S.inventario.filter(i => i.stock <= i.min);
  return `<div class="phead"><div><h1>Inventario SST</h1><p>Existencias de EPP, extintores, señalización, botiquines y luces de emergencia. Las alertas aparecen cuando un recurso llega a su mínimo.</p></div><div class="acts"><button class="btn primary" data-a="invNew">${ic('plus')}Agregar recurso</button></div></div>

const HHEAD = ['Código','Fecha','Hallazgo','Tipo','Ubicación','Área responsable','Nivel de riesgo','Prioridad','Estado','Tareas','Días de atención'];
function hRows() { return filteredH().map(h => [h.id, fmtDY(h.fecha), h.desc, h.tipo, h.area, h.areaResp, h.riesgo, h.prioridad, HST[h.estado][0], S.tareas.filter(t => t.hallazgo === h.id).map(t => t.id).join(', ') || '-', h.cerradoEn ? Math.max(0, Math.round((h.cerradoEn - h.fecha) / DAY)) : '']); }
let dlP = null;
function getDl() { if (!dlP) dlP = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null); return dlP; }
async function saveFile(name, data, mime) {
  const dl = await getDl();
  if (dl) {
    try { await dl.save({filename:name, data}); toast(`Archivo listo: <em>${name}</em>`); }
    catch (e) { toast(e && e.code === 'declined' ? 'Descarga cancelada.' : 'No se pudo descargar en esta vista.'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], {type:mime}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Archivo listo: <em>${name}</em>`);
}
async function exportX() {
  const rows = hRows();
  if (!rows.length) return toast('No hay hallazgos para exportar con estos filtros.');

    ws['!cols'] = [8,12,44,26,18,18,14,10,12,16,16].map(w => ({wch:w}));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Hallazgos');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    return saveFile('hallazgos-sst.xlsx', out, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }
  const csv = '\ufeff' + [HHEAD, ...rows].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
  return saveFile('hallazgos-sst.csv', csv, 'text/csv');

function readImg(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('No se pudo leer la imagen'));
    r.onload = () => { const img = new Image(); img.onload = () => { const m = 960, s = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8)); }; img.onerror = () => rej(new Error('Formato no soportado')); img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function setPv(key) { const el = document.querySelector(`[data-pv="${key}"]`); if (el) el.innerHTML = `<img src="${UI.photos[key]}" alt="Vista previa de la foto">`; }

  eppDeliver: (el) => eppDeliver(el.dataset.id), eppDeliverSave: (el) => eppDeliverSave(el.dataset.id),
  libTab: (el) => { UI.libTab = el.dataset.v; render(); }, libOpen: (el) => libOpen(el.dataset.id), libEdit: (el) => libEdit(el.dataset.id), libSave: (el) => libSave(el.dataset.id),
  libDel: (el) => modal('Eliminar contenido', '<p>El contenido dejará de estar disponible para los trabajadores.</p>', `<button class="btn" data-a="close">Cancelar</button><button class="btn danger" data-a="libDelDo" data-id="${el.dataset.id}">Eliminar</button>`),
  libDelDo: (el) => { S.biblioteca = S.biblioteca.filter(b => b.id !== el.dataset.id); closeModal(); commit(); toast('Contenido eliminado.'); },
  readAll: () => { myNotifs().forEach(n => n.read = true); commit(); },
  notifOpen: (el) => notifOpen(el.dataset.id),
  halNew, halSave, halClose: (el) => { closeModal(); halClose(el.dataset.id); }, halDiscard: (el) => halDiscard(el.dataset.id), halDiscardSave: (el) => halDiscardSave(el.dataset.id),
  exportX, exportP,
  taskNew: (el) => taskNew(el.dataset.id), taskSave: (el) => taskSave(el.dataset.id),
  tTab: (el) => { UI.tTab = el.dataset.v; render(); }, eTab: (el) => { UI.eTab = el.dataset.v; render(); }, invTab: (el) => { UI.invTab = el.dataset.v; render(); },
  taskAccept: (el) => taskAccept(el.dataset.id), modAsk: (el) => modAsk(el.dataset.id), modSend: (el) => modSend(el.dataset.id),
  modApprove: (el) => modApprove(el.dataset.id), modReject: (el) => modReject(el.dataset.id), modRejectSave: (el) => modRejectSave(el.dataset.id),
  stepDo: (el) => stepDo(el.dataset.id, +el.dataset.v), stepSave: (el) => stepSave(el.dataset.id, +el.dataset.v), stepUndo: (el) => stepUndo(el.dataset.id, +el.dataset.v),
  taskDone: (el) => taskDone(el.dataset.id), taskClose: (el) => taskClose(el.dataset.id), taskReturn: (el) => taskReturn(el.dataset.id), taskReturnSave: (el) => taskReturnSave(el.dataset.id),
  invMove: (el) => invMove(el.dataset.id, el.dataset.v), invMoveSave: (el) => invMoveSave(el.dataset.id, el.dataset.v), invMin: (el) => invMin(el.dataset.id), invMinSave: (el) => invMinSave(el.dataset.id), invNew, invNewSave,
  intNew, intSave, intMove: (el) => intMove(el.dataset.id, +el.dataset.v),
  respFilter: (el) => { UI.hf = {estado:'',riesgo:'',area:'',resp:el.dataset.v,q:''}; go('hallazgos'); },
  assign: (el) => assignModal(el.dataset.v, el.dataset.id), assignSave, puestoHist: (el) => puestoHist(el.dataset.id)
};
document.addEventListener('click', (e) => {
  const z = e.target.closest('img[data-zoom]');
  if (z) { const lb = document.getElementById('lb'); lb.innerHTML = `<div class="lightbox" data-lb><img src="${z.src}" alt="${esc(z.alt)}"></div>`; return; }
  if (e.target.closest('[data-lb]')) { document.getElementById('lb').innerHTML = ''; return; }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const a = el.dataset.a;
  if (a === 'scrim') { if (e.target === el) closeModal(); return; }
  if (A[a]) { e.preventDefault(); A[a](el, e); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (document.getElementById('lb').innerHTML) document.getElementById('lb').innerHTML = ''; else if (document.getElementById('modal').innerHTML) closeModal(); else if (UI.drawer) { UI.drawer = false; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('#l-dni, #l-pw')) doLogin();
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.matches('[data-file]')) {
    const f = el.files && el.files[0]; if (!f) return;
    try { UI.photos[el.dataset.file] = await readImg(f); setPv(el.dataset.file); } catch (err) { toast('No se pudo cargar esa imagen. Prueba con otra.'); }
  }
  if (el.id === 't-area') { const s = $('#t-puesto'); if (s) s.innerHTML = puestoOpts(el.value); }
  if (el.matches('[data-hf]')) { UI.hf[el.dataset.hf] = el.value; updateH(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'h-q') { UI.hf.q = e.target.value; updateH(); } });

load();
render();
setTimeout(getDl, 0);

</script>
